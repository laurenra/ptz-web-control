<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PTZ Camera Control</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="VISCA over IP PTZ camera controller">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#2f312f">
</head>

<body>
  <main class="ptz-app" aria-labelledby="app-title">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">PTZ</div>
      <h1 id="app-title">Camera Control</h1>
    </header>

    <div class="app-tabs" role="tablist" aria-label="Camera controller">
      <button id="camera-control-tab" class="app-tab" type="button" role="tab" aria-controls="camera-control-panel" aria-selected="true">Camera Control</button>
      <button id="camera-settings-tab" class="app-tab" type="button" role="tab" aria-controls="camera-settings-panel" aria-selected="false" tabindex="-1">Camera Settings</button>
      <button id="cameras-setup-tab" class="app-tab" type="button" role="tab" aria-controls="cameras-setup-panel" aria-selected="false" tabindex="-1">Cameras Setup</button>
      <button id="general-setup-tab" class="app-tab" type="button" role="tab" aria-controls="general-setup-panel" aria-selected="false" tabindex="-1">General Setup</button>
    </div>

    <section id="camera-control-panel" class="tab-panel" role="tabpanel" aria-labelledby="camera-control-tab" tabindex="0">
      <div class="panel camera-selection">
        <label class="field" for="active-camera">
          <span>Camera</span>
          <select id="active-camera" name="activeCamera"></select>
        </label>
        <p id="active-camera-address" class="section-description"></p>
        <p id="camera-connection-status" class="section-description" role="status"></p>
      </div>
      <div class="control-workspace">
        <section class="panel control-panel" aria-labelledby="control-title">
          <h2 id="control-title">Control</h2>
          <div class="control-layout">
            <div class="motion-pad" aria-label="Pan and tilt controls">
              <button class="arrow-button up" type="button" data-direction="up" aria-label="Move up"></button>
              <button class="arrow-button left" type="button" data-direction="left" aria-label="Move left"></button>
              <button class="arrow-button stop" type="button" data-direction="stop" aria-label="Stop"></button>
              <button class="arrow-button right" type="button" data-direction="right" aria-label="Move right"></button>
              <button class="arrow-button down" type="button" data-direction="down" aria-label="Move down"></button>
            </div>

            <div class="speed-fields" aria-label="Speed controls">
              <label class="speed-field" for="pan-speed">
                <span>Pan</span>
                <input id="pan-speed" name="panSpeed" type="number" min="1" max="25" value="10" inputmode="numeric">
              </label>
              <label class="speed-field" for="tilt-speed">
                <span>Tilt</span>
                <input id="tilt-speed" name="tiltSpeed" type="number" min="1" max="25" value="10" inputmode="numeric">
              </label>
              <label class="speed-field" for="zoom-speed">
                <span>Zoom</span>
                <input id="zoom-speed" name="zoomSpeed" type="number" min="1" max="8" value="4" inputmode="numeric">
              </label>
              <label class="speed-field" for="focus-speed">
                <span>Focus</span>
                <input id="focus-speed" name="focusSpeed" type="number" min="1" max="8" value="4" inputmode="numeric">
              </label>
            </div>
          </div>

          <div class="preset-grid" aria-label="Presets">
            <button class="preset-button" type="button" data-preset="1">1</button>
            <button class="preset-button" type="button" data-preset="2">2</button>
            <button class="preset-button" type="button" data-preset="3">3</button>
            <button class="preset-button" type="button" data-preset="4">4</button>
            <button class="preset-button" type="button" data-preset="5">5</button>
            <button class="preset-button" type="button" data-preset="6">6</button>
            <button class="preset-button" type="button" data-preset="7">7</button>
            <button class="preset-button" type="button" data-preset="8">8</button>
            <button class="preset-button" type="button" data-preset="9">9</button>
          </div>
        </section>

        <section class="panel status-panel" aria-labelledby="status-title">
          <h2 id="status-title">Packet</h2>
          <output id="packet-output" aria-live="polite">Ready</output>
        </section>
      </div>
    </section>

    <section id="camera-settings-panel" class="tab-panel panel camera-settings-placeholder" role="tabpanel" aria-labelledby="camera-settings-tab" tabindex="0" hidden></section>

    <section id="cameras-setup-panel" class="tab-panel" role="tabpanel" aria-labelledby="cameras-setup-tab" tabindex="0" hidden>
      <div class="panel cameras-setup-panel">
        <h2>Cameras Setup</h2>
        <p class="section-description">Set up to eight cameras. Changes are saved automatically in this browser.</p>
        <div id="camera-list" class="camera-grid"></div>
        <p id="camera-setup-status" class="section-description" role="status"></p>
      </div>
    </section>

    <section id="general-setup-panel" class="tab-panel" role="tabpanel" aria-labelledby="general-setup-tab" tabindex="0" hidden>
      <section class="panel setup-panel" aria-labelledby="setup-title">
        <h2 id="setup-title">General Setup</h2>

        <section class="setup-section" aria-labelledby="general-setup-title">
          <h3 id="general-setup-title">WebSocket connection</h3>
          <div class="field-stack websocket-settings">
            <label class="field" for="websocket-host">
              <span>WebSocket server IP or hostname</span>
              <input id="websocket-host" name="websocketHost" type="text" autocomplete="off" spellcheck="false" value="127.0.0.1" required>
            </label>
            <label class="field" for="websocket-port">
              <span>WebSocket server port</span>
              <input id="websocket-port" name="websocketPort" type="number" inputmode="numeric" min="1" max="65535" value="8080" required>
            </label>
          </div>
          <div class="setup-actions">
            <button id="open-discovery-socket" class="setup-button" type="button">Open Socket</button>
            <button id="find-cameras" class="setup-button" type="button" disabled>Find Cameras</button>
            <button id="test-socket" class="setup-button" type="button" disabled>Test Socket</button>
            <button id="show-listeners" class="setup-button" type="button">Show Listeners</button>
          </div>
          <p id="discovery-status" role="status">Socket closed. Select Open Socket to connect.</p>
        </section>

        <section class="setup-section response-section" aria-labelledby="server-responses-title">
          <h3 id="server-responses-title">UDP Server Responses</h3>
          <div id="server-responses" class="server-responses" role="log" aria-labelledby="server-responses-title" aria-live="polite" tabindex="0">
            <p class="response-placeholder">Server responses will appear here after connecting.</p>
          </div>
        </section>
      </section>
    </section>

    <template id="camera-template">
      <fieldset class="camera-card">
        <legend></legend>
        <div class="field-stack">
          <label class="field">
            <span>Custom name</span>
            <input data-camera-field="name" type="text" autocomplete="off">
          </label>
          <label class="field">
            <span>Camera IP address</span>
            <input data-camera-field="ip" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="192.168.1.100">
          </label>
          <label class="field">
            <span>Camera port</span>
            <input data-camera-field="port" type="number" inputmode="numeric" min="1" max="65535" value="52381" required>
          </label>
        </div>
      </fieldset>
    </template>
  </main>

  <script type="module" src="js/app.js"></script>
</body>

</html>
